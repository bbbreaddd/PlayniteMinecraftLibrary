name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build extension
        run: dotnet build PlayniteMultiMCLibrary\PlayniteMultiMCLibrary.csproj -c Release

      - name: Package .pext
        id: pack
        shell: pwsh
        run: |
          $extensionYaml = "PlayniteMultiMCLibrary\extension.yaml"
          $versionMatch = Select-String -Path $extensionYaml -Pattern "^Version:\s*(.+)"
          $idMatch = Select-String -Path $extensionYaml -Pattern "^Id:\s*(.+)"

          if (-not $versionMatch -or -not $idMatch) {
            throw "Failed to extract Version or Id from $extensionYaml"
          }

          $version = $versionMatch.Matches.Groups[1].Value.Trim()
          $addonId = $idMatch.Matches.Groups[1].Value.Trim()
          $versionUnderscore = $version.Replace('.', '_')
          $pextName = "${addonId}_${versionUnderscore}.pext"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $tempZip = "dist\temp.zip"
          $targetPext = "dist\$pextName"

          Compress-Archive -Path "PlayniteMultiMCLibrary\bin\Release\net48\*" -DestinationPath $tempZip -Force
          Move-Item -Path $tempZip -Destination $targetPext -Force

          Write-Host "Packaged $targetPext successfully"
          "pext_name=$pextName" >> $env:GITHUB_OUTPUT
          "pext_path=$targetPext" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.pext_name }}
          path: ${{ steps.pack.outputs.pext_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.pack.outputs.version) }}
          files: ${{ steps.pack.outputs.pext_path }}
          generate_release_notes: true
